name: Checks · Lint
run-name: "Checks · Lint · ${{ github.event_name }} · ${{ github.sha }}"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: grootan-devops/github-ci-library/.github/workflows/lint.yml@dev
    permissions:
      contents: read
    secrets: inherit
    with:
      lint-md-files: "*.md"
      md-lint-ignore-rule: "MD041 MD029"
