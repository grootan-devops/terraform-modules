name: Security · Secret Scan
run-name: "Security · Secret Scan · ${{ github.event_name }} · ${{ github.sha }}"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    uses: grootan-devops/github-ci-library/.github/workflows/secret-scanning.yml@1.3.1
    permissions:
      contents: read
    secrets: inherit
    with:
      full-history: true
